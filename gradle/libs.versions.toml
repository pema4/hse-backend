[versions]
jackson = "2.20.0"
jetty = "12.1.1"
junit = "6.0.1"
reactor = "3.8.0"
spring = "7.0.0"

[libraries]
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jetty-ee11-webapp = { module = "org.eclipse.jetty.ee11:jetty-ee11-webapp", version.ref = "jetty" }
jetty-server = { module = "org.eclipse.jetty:jetty-server", version.ref = "jetty" }
reactor-core = { group = "io.projectreactor", name = "reactor-core", version.ref = "reactor" }
spring-context = { group = "org.springframework", name = "spring-context", version.ref = "spring" }
spring-test = { group = "org.springframework", name = "spring-test", version.ref = "spring" }
spring-webflux = { group = "org.springframework", name = "spring-webflux", version.ref = "spring" }
spring-webmvc = { group = "org.springframework", name = "spring-webmvc", version.ref = "spring" }
